name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  # --- Python services ---
  python-services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, data-ingestion, search]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aerofly_test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: aerofly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aerofly_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: pip install -r requirements.txt pytest pytest-asyncio httpx
      - name: Symlink shared code
        run: ln -sf ${{ github.workspace }}/shared/python services/${{ matrix.service }}/shared
      - name: Init database schemas
        env:
          PGHOST: localhost
          PGUSER: aerofly_test
          PGPASSWORD: test
          PGDATABASE: aerofly_test
        run: psql -f infrastructure/postgres/init.sql
      - name: Run tests
        working-directory: services/${{ matrix.service }}
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: aerofly_test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: aerofly_test
          REDIS_HOST: localhost
        # Exit code 5 = "no tests collected" — treat as success so services
        # without tests yet don't break CI.
        run: |
          set +e
          pytest tests/ -v
          code=$?
          if [ $code -eq 5 ]; then
            echo "::notice::No tests collected for ${{ matrix.service }} — treating as success."
            exit 0
          fi
          exit $code

  # --- Frontend ---
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Workaround for npm/cli#4828: package-lock.json generated on Windows
      # omits Linux-specific rollup binaries. Drop the lockfile + node_modules
      # and run a fresh install so npm resolves the correct platform binary
      # (backed up by optionalDependencies in package.json).
      - name: Install dependencies (platform-safe)
        working-directory: services/frontend
        run: |
          rm -rf node_modules package-lock.json
          npm install --no-audit --no-fund
      - name: Type check
        working-directory: services/frontend
        run: npx tsc --noEmit
      - name: Run tests
        working-directory: services/frontend
        run: npx vitest run
